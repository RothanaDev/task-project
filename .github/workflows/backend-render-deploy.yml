name: Backend CD - Trigger Railway Redeploy

on:
  workflow_run:
    workflows: ["Backend CI - Build & Push DockerHub"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Redeploy Railway (pull latest Docker image)
        run: |
          docker run --rm \
            -e RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}" \
            ghcr.io/railwayapp/cli:latest \
            redeploy --service "${{ secrets.RAILWAY_SERVICE_ID }}" -y

