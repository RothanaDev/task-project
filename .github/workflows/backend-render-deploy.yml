name: Backend CD - Trigger Render Deploy

on:
  workflow_run:
    workflows: ["Backend CI - Build & Push DockerHub"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook (retry)
        run: |
          echo "Waiting so Docker Hub finishes updating latest..."
          sleep 60

          echo "Trigger Render deploy hook..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

          echo "Done."
