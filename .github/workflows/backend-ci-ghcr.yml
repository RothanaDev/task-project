name: Backend CI - Build & Push GHCR (Jib)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Push to GHCR with Jib (compile first)
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "Using owner: $OWNER_LOWER"
          mvn -B -DskipTests clean compile jib:build \
            -Djib.to.image=ghcr.io/${OWNER_LOWER}/task-manager:latest \
            -Djib.to.auth.username=${OWNER_LOWER} \
            -Djib.to.auth.password=${GITHUB_TOKEN}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
