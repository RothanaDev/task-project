services:
  task-postgres:
    image: postgres:16.3-bullseye
    container_name: task-postgres
    restart: always
    ports:
      - "1212:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow_db
    volumes:
      - vol-task:/var/lib/postgresql/data

  taskflow-api:
    image: taskflow-api:1.0
    container_name: taskflow-api
    depends_on:
      - task-postgres
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-postgres:5432/taskflow_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

volumes:
  vol-task:

